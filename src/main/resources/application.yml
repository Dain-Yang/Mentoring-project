
spring:
  application:
    name: mentoring-project

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul

jwt:
  secret: ZGF5b25lLXNwcmluZy1ib290LWRpdmlkZW5kLXByb2plY3QtdHV0b3JpYWwtand0LXNlY3JldC1rZXkK
  access-token-validity: 1800000
  refresh-token-validity: 1209600000

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: default
      
  datasource:
    url: jdbc:mysql://localhost:3306/mentoring_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: h2-prod

  datasource:
    url: jdbc:h2:mem:mentoring_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}
      # Upstash SSL 설정
      ssl: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.H2Dialect 
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false
